group = template.gradle.group
version = 1.0.0-SNAPSHOT
# Opt out of bundling the Kotlin standard library; the IntelliJ Platform already provides it.
# https://plugins.jetbrains.com/docs/intellij/using-kotlin.html#kotlin-standard-library
kotlin.stdlib.default.dependency = false
# Enable Gradle Configuration Cache,
# read more https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true
# Enable Gradle Build Cache,
# read more https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
